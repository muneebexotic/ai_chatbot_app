name: speakwise
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+62

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Localization scaffolding (R11.7). English only in v1, Urdu marked as the
  # first follow-up. The ARB files are in lib/l10n and AppLocalizations is
  # generated by `flutter gen-l10n` (configured in l10n.yaml, run
  # automatically by `flutter pub get` because of `generate: true` below).
  flutter_localizations:
    sdk: flutter

  # State and DI (PRD F5). package:provider is gone -- the migration is
  # complete, so nothing should reintroduce it.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend. Firebase is gone entirely as of Milestone 3 — the last three
  # packages (firebase_core, cloud_firestore, google_sign_in) went with the
  # Firestore-backed chat surface. See DECISIONS.md D0: the project was
  # suspended by Google after the Milestone 0 leak and is abandoned, not
  # migrated. Google sign-in runs through Supabase OAuth in the system browser,
  # so the native package was never imported.
  supabase_flutter: ^2.16.0

  # Voice — on-device, both of them. This is the business model (RESEARCH.md
  # §5.3): a spoken minute costs zero. Never replace with a cloud service.
  speech_to_text: ^7.1.0
  flutter_tts: ^4.2.3

  # Model access is the gateway and nothing else (PRD R9.3, F1). There is no
  # provider SDK here on purpose: an SDK in the client is a key in the client
  # waiting to happen, and `google_generative_ai` was exactly that until this
  # milestone. `http` talks to our own Edge Function, which holds the key.
  http: ^1.4.0

  # PRD §2.2: exactly one markdown renderer. DECISIONS.md D4 kept three others
  # alive for one milestone because `app_message_bubble.dart` was built on
  # them and §7.4 was going to delete it; that has now happened, so
  # flutter_markdown, flutter_highlight, and markdown are gone with it.
  gpt_markdown: ^1.1.2

  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6

  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+1

  # Removed here, to be re-added by the milestone that first imports them:
  # image_picker and permission_handler (§5.4 image understanding, and the
  # microphone in Milestone 4), connectivity_plus (R11.5 offline behaviour),
  # path/path_provider (Drift, §9.4). Every one was unused in lib/ after the
  # old chat surface was deleted, and §14 requires this file to contain only
  # what the app actually uses — a dependency kept "for later" is one nobody
  # audits and one that still ships in the APK.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used only by test/support/dart_source.dart, which parses lib/ to enforce
  # PRD §16 and R11.7 executably. It was already present transitively via
  # build_runner; naming it here stops a transitive bump from breaking the
  # tests that guard the never-do list. Dev-only, so it ships nowhere.
  analyzer: ^7.6.0
  flutter_launcher_icons: ^0.14.4
  # Was previously mis-indented at the top level of this file, which made it an
  # unrecognised key rather than a dependency. The `include:` in
  # analysis_options.yaml therefore resolved to nothing and NO lint rule has
  # ever run on this codebase. Keep it here.
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/png_icons/app_icon.png" # update path accordingly

# Flutter Native Splash Configuration
flutter_native_splash:
  # Background color for light theme (matches your custom splash)
  color: "#FAFAFA"
  # Background color for dark theme
  color_dark: "#0A0A0A"
  
  # Optional: Add your logo image here if you have one
  # image: assets/logo.png
  # image_dark: assets/logo.png
  
  # Android 12+ specific settings
  android_12:
    # Background colors for Android 12+
    color: "#FAFAFA"
    color_dark: "#0A0A0A"
    # Optional: Add logo for Android 12+
    # image: assets/logo.png
    # image_dark: assets/logo.png
    
  # iOS settings
  ios: true
  
  # Remove the background when Flutter is ready (important for seamless transition)
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Runs `flutter gen-l10n` from l10n.yaml on every `pub get` (R11.7). The
  # generated AppLocalizations is not committed; it lives under .dart_tool.
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/images/bot_icon.png
    - assets/images/user_avatar.png
    - assets/png_icons/copy.png
    - assets/png_icons/three_dot_icon.png

  # PRD §7.2 — three variable families, 717KB total (target: under 900KB).
  # Poppins and Urbanist are deleted: both are named in the §7 anti-brief and
  # the §16 never-do list.
  #
  # Each family is ONE variable file with no `weight:` key. That is deliberate.
  # Declaring weights here would make Flutter instantiate fixed cuts and ship
  # the file once per cut; instead weight is selected at use time via
  # `fontVariations: [FontVariation('wght', n)]` in AppTypography, which is
  # what keeps the payload this small.
  #
  # No italic files. They cost 594KB of the original 1311KB and would blow the
  # budget. Flutter synthesises a slant for markdown emphasis. If Milestone 3's
  # transcript rendering shows that synthesised serif italic looks wrong,
  # Newsreader-VariableItalic can be added back — and the budget revisited then,
  # with evidence.
  fonts:
    # Display and AI transcript. The typographic signature (§7.2): rendering
    # the AI's words as a serif reads like an interview in print.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader/Newsreader-Variable.ttf

    # UI and user speech.
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans/GeneralSans-Variable.ttf

    # Data: timers, durations, counts, pace, dates.
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono/GeistMono-Variable.ttf